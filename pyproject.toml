[project]
name = "financial-specialist-agent"
version = "0.1.0"
description = "A financial specialist conversational agent for budgeting, investing, retirement, and tax planning."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0",
    "python-dotenv>=1.0"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]
[project.urls]
homepage = "https://github.com/yichenwang0810/Financial-Specialist-Agent"
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
